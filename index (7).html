<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis apps</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis apps">
<meta name="theme-color" content="#1b1530">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f0ff;--bg2:#e6dcff;--sf:#ffffffcc;--ink:#26183f;--mu:#7a6d96;--bd:#ddd1f5;--ac:#7c3aed;--red:#e11d48}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1530;--bg2:#2a1f4a;--sf:#2a2146cc;--ink:#f2ecff;--mu:#aa9ec8;--bd:#40335f;--ac:#a78bfa;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(120% 80% at 20% 0%,var(--bg2),var(--bg) 60%) fixed;
  font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:clamp(1.7rem,6vw,2.3rem);margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mu);margin:0 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
a.app,.app.soon{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:22px;background:var(--sf);border:1px solid var(--bd);
  color:inherit;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .15s}
a.app:active{transform:scale(.96)}
.ico{width:60px;height:60px;border-radius:17px;display:grid;place-items:center;font-size:32px;box-shadow:0 6px 16px #0003}
.app b{font-size:1.05rem}.app small{color:var(--mu);line-height:1.3}
.app.soon{opacity:.5;border-style:dashed}
.topbar{display:flex;justify-content:flex-end;align-items:center;margin:0 0 18px;position:relative}
.profile-wrap{position:relative}
.profile-btn{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:999px;padding:8px 13px;font-weight:650;box-shadow:0 3px 12px #0000000d}
.avatar{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:white;font-size:14px}
.profile-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:5;min-width:220px;padding:10px;border:1px solid var(--bd);border-radius:16px;background:var(--sf);box-shadow:0 12px 32px #0002;backdrop-filter:blur(12px)}
.profile-email{display:block;padding:8px 9px;color:var(--mu);font-size:13px;overflow-wrap:anywhere}
.profile-menu button{width:100%;border:0;border-radius:10px;background:var(--bg2);padding:10px;text-align:left;font-weight:650}
.profile-menu button:hover{filter:brightness(.97)}
button{font:inherit;color:inherit;cursor:pointer}
.link{background:none;border:1px solid var(--bd);border-radius:12px;padding:7px 14px}
#login{max-width:340px;margin:14vh auto 0;padding:24px;border-radius:24px;background:var(--sf);border:1px solid var(--bd);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#login .logo{width:64px;height:64px;border-radius:18px;margin-bottom:12px}
#login input{width:100%;font-size:16px;margin:6px 0;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--ink)}
#login button{width:100%;margin-top:8px;padding:12px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:700}
#login button:disabled{opacity:.6}
.err{color:var(--red);font-size:14px;min-height:20px;margin:4px 0 0}
</style>
</head>
<body>
<section id="login" hidden>
  <img class="logo" src="icons/icon-192.png" alt="">
  <h1 style="font-size:1.5rem">Mis apps</h1>
  <p class="sub" style="margin-bottom:14px">Entra para ver tus aplicaciones.</p>
  <input id="em" type="email" placeholder="Correo" autocomplete="username" inputmode="email">
  <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password">
  <p class="err" id="lerr"></p>
  <button id="lbtn">Entrar</button>
</section>

<main id="home" hidden>
  <div class="topbar">
    <div class="profile-wrap">
      <button class="profile-btn" id="profileBtn" aria-expanded="false" aria-controls="profileMenu">
        <span class="avatar">👤</span><span>Mi perfil</span><span aria-hidden="true">⌄</span>
      </button>
      <div class="profile-menu" id="profileMenu" hidden>
        <span class="profile-email" id="who"></span>
        <button class="link" id="out">Cerrar sesión</button>
      </div>
    </div>
  </div>
  <h1 id="hola"></h1>
  <p class="sub">¿Qué quieres abrir?</p>
  <div class="grid" id="grid"></div>
</main>

<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
import {SUPABASE_URL,SUPABASE_KEY} from "./config.js";
import {APPS} from "./apps.js?v=3";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);

function show(user){
  $("login").hidden=!!user;$("home").hidden=!user;
  if(!user)return;
  const h=new Date().getHours();
  $("hola").textContent=(h<6?"Buenas noches":h<13?"Buenos días":h<21?"Buenas tardes":"Buenas noches");
  $("who").textContent=user.email||"Cuenta conectada";
  $("profileMenu").hidden=true;
  $("profileBtn").setAttribute("aria-expanded","false");
  $("grid").innerHTML=APPS.map(a=>{
    const inner=`<div class="ico" style="background:linear-gradient(135deg,${esc(a.color)},${esc(a.color)}bb)">${esc(a.icono)}</div><b>${esc(a.nombre)}</b><small>${esc(a.desc)}</small>`;
    return `<a class="app" href="${esc(a.ruta)}">${inner}</a>`;
  }).join("");
}
sb.auth.onAuthStateChange((_e,s)=>show(s?.user||null));
sb.auth.getSession().then(({data})=>show(data.session?.user||null));

async function entrar(){
  $("lerr").textContent="";$("lbtn").disabled=true;
  const{error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  $("lbtn").disabled=false;
  if(error)$("lerr").textContent="Correo o contraseña incorrectos.";
}
$("lbtn").onclick=entrar;
$("pw").onkeydown=e=>{if(e.key==="Enter")entrar()};
$("profileBtn").onclick=()=>{
  const open=$("profileMenu").hidden;
  $("profileMenu").hidden=!open;
  $("profileBtn").setAttribute("aria-expanded",String(open));
};
document.addEventListener("click",e=>{
  if(!e.target.closest(".profile-wrap")){
    $("profileMenu").hidden=true;
    $("profileBtn").setAttribute("aria-expanded","false");
  }
});
$("out").onclick=async()=>{await sb.auth.signOut()};
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
