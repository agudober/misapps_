<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Horarios">
<meta name="theme-color" content="#8b5cf6">
<title>Mis horarios</title>

<style>
:root{--bg:#f6f2ff;--sf:#fff;--tx:#2b2140;--mu:#7d7195;--bd:#e3d9f7;--ac:#8b5cf6;--ac2:#6d3fe0;--hl:#ede4ff;--red:#e11d48}
@media (prefers-color-scheme:dark){:root{--bg:#171123;--sf:#221a33;--tx:#f0eafc;--mu:#a99cc4;--bd:#3a2d57;--ac:#a78bfa;--ac2:#8b5cf6;--hl:#33264f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 ui-rounded,'SF Pro Rounded',system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px} /* evita el zoom de iOS */
.btn{border:1px solid var(--bd);background:var(--sf);padding:8px 14px;border-radius:12px;cursor:pointer}
.btn.pri{background:var(--ac2);border-color:var(--ac2);color:#fff}
.btn.del{color:var(--red)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff}
header h1{margin:0;font-size:19px;flex:1;text-align:center}.home{color:#fff;text-decoration:none;font-weight:700;white-space:nowrap}
header button{background:#ffffff30;border:0;color:#fff;border-radius:10px;padding:6px 10px}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:1100px;margin:auto}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs button{flex:1;border:0;background:none;padding:9px 2px 7px;font-size:11px;color:var(--mu);position:relative}
.tabs button span{display:block;font-size:20px}
.tabs button.on{color:var(--ac2);font-weight:700}
.badge{position:absolute;top:3px;left:55%;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.bar h2{margin:0;font-size:18px;flex:1;text-transform:capitalize}
.today{background:var(--sf);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.today b{display:block;margin-bottom:3px}
.today div{display:flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dh{text-align:center;color:var(--mu);font-size:12px}
.day{min-height:96px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:4px;overflow:hidden;cursor:pointer}
.day.out{opacity:.4}
.day.td{box-shadow:inset 0 0 0 2px var(--ac)}
.day .n{font-weight:700;font-size:14px}
.chip{display:block;font-size:11px;color:#fff;border-radius:5px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:none;flex-wrap:wrap;gap:3px;margin-top:4px}
.more{font-size:11px;color:var(--mu)}
@media (max-width:640px){.day{min-height:62px}.chip,.more{display:none}.dots{display:flex}main{padding-left:8px;padding-right:8px}}
.wk{display:grid;grid-template-columns:38px repeat(7,minmax(104px,1fr));min-width:780px;background:var(--sf);border:1px solid var(--bd);border-radius:12px}
.wk .h{padding:6px 2px;text-align:center;font-size:12px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--sf);z-index:3}
.wk .h.sel{background:var(--ac2);color:#fff}
.hrs{position:sticky;left:0;background:var(--sf);z-index:4}
.hrs div{height:48px;font-size:10px;color:var(--mu);text-align:right;padding:2px 4px 0 0;border-top:1px solid var(--bd)}
.col{position:relative;border-left:1px solid var(--bd)}
.col.sel{background:var(--hl)}
.slot{height:48px;border-top:1px solid var(--bd)}
.ev{position:absolute;left:2px;right:2px;border-radius:8px;color:#fff;padding:2px 5px;font-size:12px;line-height:1.2;overflow:hidden;cursor:pointer;z-index:1;box-shadow:0 1px 3px #0003}
.ev.urg{outline:2px solid #fff;box-shadow:0 0 0 2px var(--red)}
.ev small{display:block;opacity:.92;font-size:11px}
.leg{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.card{display:flex;gap:8px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-bottom:6px}
.card input[type=color]{width:40px;height:34px;border:0;padding:0;background:none}
.card input[type=text]{flex:1;min-width:0;border:1px solid var(--bd);border-radius:8px;padding:7px;background:var(--bg)}
.msg{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.msg.new{border-left:5px solid var(--ac);font-weight:600}
.msg small{display:block;color:var(--mu);font-weight:400;white-space:pre-line}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--sf);color:var(--tx);padding:16px;width:min(92vw,400px);max-height:90vh;overflow:auto}
dialog::backdrop{background:#0007}
dialog label{display:block;margin:8px 0 2px;font-size:13px;color:var(--mu)}
dialog input:not([type=checkbox]),dialog select,dialog textarea{width:100%;border:1px solid var(--bd);border-radius:10px;padding:8px;background:var(--bg)}
dialog .chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px}
.row{display:flex;gap:8px}.row>*{flex:1}
.acts{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
@media (max-width:640px){dialog{margin:auto 0 0;width:100%;max-width:none;border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}}
.err{color:var(--red);font-size:13px;min-height:18px}
</style>
</head>
<body>
<div id="app" hidden>
  <header><a class="home" href="../">⌂ Inicio</a><h1>🗓️ Mis horarios</h1><button id="out">Salir</button></header>
  <main>
    <section id="cal"></section><section id="sem" hidden></section>
    <section id="act" hidden></section><section id="buz" hidden></section>
  </main>
  <div class="tabs">
    <button data-t="cal"><span>📆</span>Calendario</button>
    <button data-t="sem"><span>🕒</span>Semana</button>
    <button data-t="act"><span>🎨</span>Actividades</button>
    <button data-t="buz"><span>✉️</span>Buzón<i class="badge" id="bd" hidden></i></button>
  </div>
</div>

<dialog id="dlg">
  <h3 id="dt" style="margin:0"></h3>
  <label>Título</label><input id="f_t">
  <label>Actividad</label><select id="f_k"></select>
  <label>Día</label><input id="f_d" type="date">
  <div class="row"><div><label>Inicio</label><input id="f_s" type="time"></div><div><label>Fin</label><input id="f_e" type="time"></div></div>
  <label>Repetir</label>
  <select id="f_r"><option value="">No repetir</option><option value="1">Todos los lunes</option><option value="2">Todos los martes</option><option value="3">Todos los miércoles</option><option value="4">Todos los jueves</option><option value="5">Todos los viernes</option><option value="6">Todos los sábados</option><option value="7">Todos los domingos</option></select>
  <label class="chk" style="margin-top:10px"><input type="checkbox" id="f_u"> ❗ Urgente</label>
  <label>Compartir con</label><div id="f_sh"></div>
  <label>Notas</label><textarea id="f_n" rows="2"></textarea>
  <div class="err" id="derr"></div>
  <div class="acts"><button class="btn del" id="b_del">Borrar</button><button class="btn" id="b_can">Cerrar</button><button class="btn pri" id="b_ok">Guardar</button></div>
</dialog>

<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
import {SUPABASE_URL,SUPABASE_KEY} from "../config.js";
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const H0=6,H1=23,pad=n=>String(n).padStart(2,'0'),$=id=>document.getElementById(id);
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const mon=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const tmin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const dow=k=>(pd(k).getDay()+6)%7+1;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let me=null,profiles=[],types=[],events=[],msgs=[],tab='cal',selDay=ymd(new Date()),view=new Date(),cur=null;
view.setDate(1);
const typ=id=>types.find(t=>t.id===id)||{name:'Sin actividad',color:'#8b5cf6'};
const myTypes=()=>types.filter(t=>t.owner_id===me.id);
const pname=id=>profiles.find(p=>p.id===id)?.name||'Alguien';
const occ=k=>events.filter(e=>e.date===k||(e.repeat_dow&&e.repeat_dow===dow(k)&&k>=e.date))
  .sort((a,b)=>(b.urgent-a.urgent)||a.start_time.localeCompare(b.start_time));

async function load(){
  const [p,t,e,m]=await Promise.all([
    sb.from('profiles').select('id,name'),sb.from('activity_types').select('*').order('name'),
    sb.from('events').select('*, event_shares(user_id)'),sb.from('messages').select('*').order('created_at',{ascending:false})]);
  profiles=p.data||[];types=t.data||[];msgs=m.data||[];
  events=(e.data||[]).map(x=>({...x,start_time:x.start_time.slice(0,5),end_time:x.end_time.slice(0,5),shares:(x.event_shares||[]).map(s=>s.user_id)}));
  render();
}
const mark=e=>(e.urgent?'❗':'')+((e.shares.length||e.owner_id!==me.id)?'🤝':'')+(e.repeat_dow?'🔁':'');
const legend=()=>'<div class="leg">'+myTypes().map(t=>`<span><i class="dot" style="background:${t.color}"></i> ${esc(t.name)}</span>`).join('')+'</div>';

function renderCal(){
  const start=mon(new Date(view.getFullYear(),view.getMonth(),1)),today=ymd(new Date()),td=occ(today);
  let h='';
  if(td.length)h+=`<div class="today"><b>Hoy tienes ${td.length} ${td.length>1?'cosas':'cosa'}:</b>`+td.map(e=>`<div><i class="dot" style="background:${typ(e.type_id).color}"></i>${e.start_time} ${esc(e.title)} ${mark(e)}</div>`).join('')+'</div>';
  h+=`<div class="bar"><button class="btn" id="pm">‹</button><h2>${MESES[view.getMonth()]} ${view.getFullYear()}</h2><button class="btn" id="hoy">Hoy</button><button class="btn" id="nm">›</button></div><div class="mgrid">`;
  DIAS.forEach(d=>h+=`<div class="dh">${d}</div>`);
  for(let i=0;i<42;i++){
    const d=addD(start,i),k=ymd(d);if(i>=35&&d.getMonth()!==view.getMonth())break;
    const ev=occ(k);
    h+=`<div class="day${d.getMonth()!==view.getMonth()?' out':''}${k===today?' td':''}" data-d="${k}"><div class="n">${d.getDate()}</div>`;
    ev.slice(0,4).forEach(e=>h+=`<span class="chip" style="background:${typ(e.type_id).color}">${mark(e)} ${esc(e.title)}</span>`);
    if(ev.length>4)h+=`<div class="more">+${ev.length-4} más</div>`;
    h+='<div class="dots">'+ev.slice(0,6).map(e=>`<i class="dot" style="background:${typ(e.type_id).color}${e.urgent?';outline:2px solid var(--red)':''}"></i>`).join('')+'</div></div>';
  }
  $('cal').innerHTML=h+'</div>'+legend();
  $('pm').onclick=()=>{view.setMonth(view.getMonth()-1);renderCal()};
  $('nm').onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};
  $('hoy').onclick=()=>{view=new Date();view.setDate(1);renderCal()};
  document.querySelectorAll('.day').forEach(el=>el.onclick=()=>{selDay=el.dataset.d;go('sem')});
}

function renderSem(){
  const ws=mon(pd(selDay)),we=addD(ws,6),today=ymd(new Date());
  let h=`<div class="bar"><button class="btn" id="pw">‹</button><h2>${ws.getDate()} ${MESES[ws.getMonth()]} – ${we.getDate()} ${MESES[we.getMonth()]}</h2><button class="btn" id="hs">Hoy</button><button class="btn" id="nw">›</button></div><div class="wrap" id="wrap"><div class="wk"><div class="h hrs" style="top:0"></div>`;
  for(let i=0;i<7;i++){const d=addD(ws,i),k=ymd(d);h+=`<div class="h${k===selDay?' sel':''}"><b>${DIAS[i]} ${d.getDate()}</b></div>`}
  h+='<div class="hrs">';for(let x=H0;x<H1;x++)h+=`<div>${pad(x)}</div>`;h+='</div>';
  for(let i=0;i<7;i++){
    const k=ymd(addD(ws,i));h+=`<div class="col${k===selDay?' sel':''}" data-d="${k}" id="c${i}">`;
    for(let x=H0;x<H1;x++)h+=`<div class="slot" data-h="${x}"></div>`;
    occ(k).forEach(e=>{
      const a=Math.max(tmin(e.start_time),H0*60),b=Math.min(tmin(e.end_time),H1*60);if(b<=a)return;
      h+=`<div class="ev${e.urgent?' urg':''}" data-id="${e.id}" data-d="${k}" style="top:${(a-H0*60)*.8}px;height:${Math.max((b-a)*.8-2,18)}px;background:${typ(e.type_id).color}"><b>${esc(e.title)}</b> ${mark(e)}<small>${e.start_time}–${e.end_time}</small></div>`;
    });
    h+='</div>';
  }
  $('sem').innerHTML=h+'</div></div>'+legend();
  const mv=n=>{selDay=ymd(addD(pd(selDay),n));renderSem()};
  $('pw').onclick=()=>mv(-7);$('nw').onclick=()=>mv(7);$('hs').onclick=()=>{selDay=today;renderSem()};
  document.querySelectorAll('.slot').forEach(el=>el.onclick=()=>{const x=+el.dataset.h;openEv({date:el.parentNode.dataset.d,start_time:pad(x)+':00',end_time:x<23?pad(x+1)+':00':'23:59',shares:[]})});
  document.querySelectorAll('.ev').forEach(el=>el.onclick=ev=>{ev.stopPropagation();openEv(events.find(e=>e.id===el.dataset.id))});
  const sc=$('wrap'),i=(dow(selDay)-1);sc.scrollLeft=Math.max(0,$('c'+i).offsetLeft-38-8);
  sc.scrollTop=0;
}

function renderAct(){
  let h='<div class="bar"><h2>Mis actividades</h2><button class="btn pri" id="addT">+ Añadir</button></div>';
  myTypes().forEach(t=>h+=`<div class="card" data-id="${t.id}"><input type="color" value="${t.color}"><input type="text" value="${esc(t.name)}"><button class="btn del">✕</button></div>`);
  $('act').innerHTML=h+'<p style="color:var(--mu);font-size:13px">Estas actividades son solo tuyas. Su color se usa en el calendario y en el horario.</p>';
  $('addT').onclick=async()=>{await sb.from('activity_types').insert({name:'Nueva actividad',color:'#a855f7'});load()};
  document.querySelectorAll('#act .card').forEach(r=>{
    const id=r.dataset.id,[c,n,b]=r.children;
    c.onchange=async()=>{await sb.from('activity_types').update({color:c.value}).eq('id',id);load()};
    n.onchange=async()=>{await sb.from('activity_types').update({name:n.value.trim()||'Actividad'}).eq('id',id);load()};
    b.onclick=async()=>{if(confirm('¿Quitar esta actividad? Sus quehaceres quedarán sin actividad.')){await sb.from('activity_types').delete().eq('id',id);load()}};
  });
}

function renderBuz(){
  let h='<div class="bar"><h2>Buzón</h2></div>';
  if(!msgs.length)h+='<p style="color:var(--mu)">Aquí llegarán las actividades que te compartan y tu resumen diario.</p>';
  msgs.forEach(m=>h+=`<button class="msg${m.read?'':' new'}" data-id="${m.id}">${esc(m.subject)}<small>${new Date(m.created_at).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'})}\n${esc(m.body)}</small></button>`);
  $('buz').innerHTML=h;
  document.querySelectorAll('.msg').forEach(el=>el.onclick=async()=>{
    const m=msgs.find(x=>x.id===el.dataset.id);
    if(!m.read){await sb.from('messages').update({read:true}).eq('id',m.id);m.read=true}
    const ev=events.find(e=>e.id===m.event_id);if(ev){selDay=ev.date;go('sem')}else render();
  });
}

function openEv(e){
  cur=e;const mine=!e.id||e.owner_id===me.id;
  $('dt').textContent=!e.id?'Nuevo quehacer':mine?'Editar quehacer':'Compartido por '+pname(e.owner_id);
  $('f_t').value=e.title||'';
  const ts=mine?myTypes():types.filter(t=>t.id===e.type_id);
  $('f_k').innerHTML=ts.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  $('f_k').value=e.type_id||ts[0]?.id||'';
  $('f_d').value=e.date;$('f_s').value=e.start_time;$('f_e').value=e.end_time;
  $('f_r').value=e.repeat_dow||'';$('f_u').checked=!!e.urgent;$('f_n').value=e.notes||'';
  const others=profiles.filter(p=>p.id!==me.id);
  $('f_sh').innerHTML=others.length?others.map(p=>`<label class="chk"><input type="checkbox" value="${p.id}" ${e.shares.includes(p.id)?'checked':''}> ${esc(p.name)}</label>`).join(''):'<small>No hay más usuarios.</small>';
  document.querySelectorAll('#dlg input,#dlg select,#dlg textarea').forEach(i=>i.disabled=!mine);
  $('b_del').style.display=e.id&&mine?'':'none';$('b_ok').style.display=mine?'':'none';
  $('derr').textContent='';$('dlg').showModal();
}
$('b_can').onclick=()=>$('dlg').close();
$('b_del').onclick=async()=>{if(!confirm('¿Borrar este quehacer'+(cur.repeat_dow?' y todas sus repeticiones':'')+'?'))return;await sb.from('events').delete().eq('id',cur.id);$('dlg').close();load()};
$('b_ok').onclick=async()=>{
  const o={title:$('f_t').value.trim()||'Sin título',type_id:$('f_k').value||null,date:$('f_d').value,start_time:$('f_s').value,end_time:$('f_e').value,
    notes:$('f_n').value||null,urgent:$('f_u').checked,repeat_dow:$('f_r').value?+$('f_r').value:null};
  if(!o.date||!o.start_time||!o.end_time||tmin(o.end_time)<=tmin(o.start_time)){$('derr').textContent='Revisa el día y que el fin sea posterior al inicio.';return}
  let id=cur.id,r;
  if(id)r=await sb.from('events').update(o).eq('id',id);else{r=await sb.from('events').insert(o).select('id').single();id=r.data?.id}
  if(r.error){$('derr').textContent=r.error.message;return}
  const want=[...document.querySelectorAll('#f_sh input:checked')].map(i=>i.value),had=cur.shares||[];
  const rem=had.filter(x=>!want.includes(x)),add=want.filter(x=>!had.includes(x));
  if(rem.length)await sb.from('event_shares').delete().eq('event_id',id).in('user_id',rem);
  if(add.length)await sb.from('event_shares').insert(add.map(u=>({event_id:id,user_id:u})));
  selDay=o.date;$('dlg').close();load();
};

function go(t){tab=t;render()}
function render(){
  ['cal','sem','act','buz'].forEach(x=>$(x).hidden=x!==tab);
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const n=msgs.filter(m=>!m.read).length;$('bd').hidden=!n;$('bd').textContent=n;
  ({cal:renderCal,sem:renderSem,act:renderAct,buz:renderBuz})[tab]();
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.t));

let sessionStarted=false;
function startWithUser(user){
  if(!user){location.replace("../");return}
  me=user;$('app').hidden=false;
  if(!sessionStarted){sessionStarted=true;setTimeout(load,0)}
}
sb.auth.onAuthStateChange((_e,s)=>startWithUser(s?.user||null));
sb.auth.getSession().then(({data})=>startWithUser(data.session?.user||null));
$('out').onclick=async()=>{await sb.auth.signOut();location.replace("../")};
</script>
</body>
</html>
